<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>exercise12.1 - Media Query RWD</title>

  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
    .logos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      border: 1px solid #999;
      padding: 20px;
    }
    .logos img {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* <= 400: vertical stack */
    @media (max-width: 400px) {
      .logos {
        grid-template-columns: 1fr;
        justify-items: center;
      }
    }

    /* 400 < width <= 600: 1+2 on top row, 3 on second row */
    @media (min-width: 401px) and (max-width: 600px) {
      .logos {
        grid-template-columns: repeat(2, 1fr);
        justify-items: center;
        gap: 8px;
      }
      .logos img:nth-child(1) { grid-column: 1; }
      .logos img:nth-child(2) { grid-column: 2; }
      .logos img:nth-child(3) { grid-column: 1; }
    }

    /* > 600: three in one row, wider spacing */
    @media (min-width: 601px) {
      .logos {
        grid-template-columns: repeat(3, 1fr);
        justify-items: center;
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <div class="logos">
    <img src="media/logo1.jpg" alt="Logo 1">
    <img src="media/logo2.jpg" alt="Logo 2">
    <img src="media/logo3.jpg" alt="Logo 3">
  </div>
</body>
</html>
