<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=2.0" />
  <title>exercise12.1 - Media Query RWD</title>

  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
    .wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      border: 1px solid #999;
      padding: 20px;
    }

    /* logo shared */
    .wrap img {
      max-width: 220px;
      width: 100%;
      height: auto;
      display: block;
    }

    /* <= 400: vertical stack */
    @media (max-width: 400px) {
      .wrap {
        flex-direction: column;
        align-items: center;
      }
      .wrap img {
        max-width: 260px;
      }
    }

    /* 400 < width <= 600: horizontal centered */
    @media (min-width: 401px) and (max-width: 600px) {
      .wrap {
        flex-direction: row;
        justify-content: center;
      }
    }

    /* > 600: horizontal spaced */
    @media (min-width: 601px) {
      .wrap {
        flex-direction: row;
        justify-content: space-between;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
      }
      .wrap img {
        max-width: 260px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <img src="media/logo1.jpg" alt="Logo 1">
    <img src="media/logo2.jpg" alt="Logo 2">
    <img src="media/logo3.jpg" alt="Logo 3">
  </div>
</body>
</html>
