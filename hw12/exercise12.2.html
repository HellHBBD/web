<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>exercise12.2 - Bootstrap Grid RWD</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .box {
      border: 1px solid #999;
      padding: 20px;
    }
    .logo {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
    }
  </style>
</head>

<body style="padding: 15px;">
  <div class="container box">
    <div class="row text-center g-3">
      <div class="col-12 col-md-6 col-lg-4">
        <img class="logo" src="media/logo1.jpg" alt="Logo 1">
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <img class="logo" src="media/logo2.jpg" alt="Logo 2">
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <img class="logo" src="media/logo3.jpg" alt="Logo 3">
      </div>
    </div>
  </div>
</body>
</html>
