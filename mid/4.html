<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <title>固定 thead / tfoot 捲動效果</title>
        <style>
            table {
                width: 70%;
                border-collapse: collapse;
                margin: 20px auto;
                text-align: center;
                font-family: sans-serif;
            }

            /* 表格區塊可滾動 */
            .table-container {
                width: 80%;
                height: 300px;
                margin: auto;
                overflow-y: scroll;
                border: 2px solid #555;
            }

            /* 框線 */
            th,
            td {
                border: 1px solid #444;
                padding: 8px;
            }

            /* 表頭與表尾顏色 */
            thead {
                background-color: #f4b183;
                position: sticky;
                top: 0;
                z-index: 2; /* 確保在上方 */
            }

            tfoot {
                background-color: #bdd7ee;
                position: sticky;
                bottom: 0;
                z-index: 1;
            }

            tbody tr:nth-child(even) {
                background-color: #f2f2f2;
            }
        </style>
    </head>

    <body>
